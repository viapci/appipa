name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project OtisApp.xcodeproj -scheme OtisApp
          -configuration Release -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OtisApp.app Payload/
          zip -r OtisApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OtisApp-ipa
          path: OtisApp.ipa
          
